<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery Dashboard • S.Gamage Constructions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4 flex-wrap">
        <div>
          <div class="text-xs uppercase tracking-[0.3em] text-slate-500">S.Gamage Constructions</div>
          <h1 class="mt-1 text-2xl font-semibold">Delivery Boy Dashboard</h1>
          <p id="deliveryMeta" class="mt-1 text-sm text-slate-500">Loading profile…</p>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
          <select id="availabilitySelect" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">
            <option value="available">Available</option>
            <option value="on_route">On route</option>
            <option value="off_duty">Off duty</option>
            <option value="leave">On leave</option>
          </select>
          <button id="saveAvailabilityBtn" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Update Status</button>
          <button id="logoutDeliveryBtn" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Logout</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 space-y-6">
      <section id="statsGrid" class="grid grid-cols-1 md:grid-cols-4 gap-4"></section>

      <section class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <div class="text-sm font-semibold text-slate-900">Assigned delivery jobs</div>
            <p class="mt-1 text-sm text-slate-500">Open each order to log progress, upload proof, verify the customer code, and complete the activity record.</p>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button data-view="active" class="delivery-view-btn rounded-xl border border-slate-300 bg-slate-900 px-4 py-2 text-sm font-medium text-white">Active</button>
            <button data-view="today" class="delivery-view-btn rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Today</button>
            <button data-view="completed" class="delivery-view-btn rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Completed</button>
            <button id="refreshOrdersBtn" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Refresh</button>
          </div>
        </div>
        <div id="ordersStatus" class="mt-3 text-sm text-slate-500"></div>
        <div id="ordersWrap" class="mt-4 space-y-4"></div>
      </section>
    </main>
  </div>

  <script src="./delivery.js"></script>
</body>
</html>
