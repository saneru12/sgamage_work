<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • S.Gamage Constructions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50">
  <div class="flex">
    <aside class="w-72 bg-white border-r border-slate-200 min-h-screen p-4 sticky top-0">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-lg font-semibold text-slate-900">S.Gamage Admin</div>
          <div class="text-xs text-slate-500" id="adminUser">...</div>
        </div>
        <button id="logoutBtn" class="text-xs px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-50">Logout</button>
      </div>

      <nav class="mt-6 space-y-1" id="nav"></nav>

      <div class="mt-6 p-3 rounded-xl bg-slate-100 text-xs text-slate-600">
        Tip: Use <b>Settings</b> to change site name, contact details, hero text.
      </div>
    </aside>

    <main class="flex-1 p-6">
      <div id="pageHeader" class="mb-4"></div>
      <div id="content" class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4"></div>
    </main>
  </div>

  <script src="./admin.js"></script>
  <script>
    window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });
    AdminUI.mountApp();
  </script>
</body>
</html>
